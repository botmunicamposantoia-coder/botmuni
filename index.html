<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Asistente Ciudadano - Diputado Germán Ralle</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-body: #f8fafc;
            --chat-bg: #ffffff;
            --bot-msg-bg: #f1f5f9;
            --user-msg-bg: #1e3a8a;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-body);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 641px) {
            .chat-container {
                height: 90vh;
                max-height: 820px;
                border-radius: 16px;
                border: 1px solid var(--border);
            }
        }

        /* Header */
        .chat-header {
            background: var(--primary);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-info h2 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
        }

        .header-info p {
            font-size: 12px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
        }

        /* Body Chat */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f8fafc;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            background-color: var(--bot-msg-bg);
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .user-message {
            background-color: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Sugerencias rápidas */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .chip {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .chip:active {
            background: var(--primary);
            color: white;
        }

        /* Typing indicator */
        .typing {
            display: none;
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            padding: 10px 14px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-items: center;
        }

        .typing span {
            height: 7px;
            width: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
            margin: 0 2px;
        }

        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Footer */
        .chat-footer {
            padding: 10px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: white;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }

        .input-form {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .attach-btn {
            background: transparent;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .attach-btn:active, .attach-btn.has-file {
            color: var(--primary);
        }

        .input-form input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            transition: border 0.2s;
            background: #f8fafc;
        }

        .input-form input[type="text"]:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn:active {
            background: var(--primary-hover);
            transform: scale(0.95);
        }

        .disclaimer {
            font-size: 9px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="avatar">
            <img src="images.jpg" alt="Diputado Germán Ralle">
        </div>
        <div class="header-info">
            <h2>Asistente Ciudadano</h2>
            <p><span class="status-dot"></span> Diputado Germán Ralle</p>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-body" id="chatBody">
        <div class="message bot-message">
            ¡Hola! 👋 Soy el asistente virtual de atención ciudadana del Diputado Germán Ralle. ¿En qué puedo ayudarte hoy?
        </div>

        <div class="suggestions" id="suggestions">
            <div class="chip" onclick="sendQuickMessage('¿Quién es Germán Ralle?')">¿Quién es Germán Ralle?</div>
            <div class="chip" onclick="sendQuickMessage('¿Qué proyectos presentó?')">¿Qué proyectos presentó?</div>
            <div class="chip" onclick="sendQuickMessage('¿Cómo hacer una consulta?')">¿Cómo hacer una consulta?</div>
        </div>

        <div class="typing" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input Form -->
    <div class="chat-footer">
        <form class="input-form" id="chatForm" onsubmit="handleSend(event)">
            <!-- Botón del clip y el input de archivo oculto -->
            <label for="fileInput" class="attach-btn" id="attachLabel">
                <i class="fa-solid fa-paperclip"></i>
            </label>
            <input type="file" id="fileInput" style="display: none;" accept="image/*,.pdf" onchange="updateFileLabel()">
            
            <input type="text" id="userInput" placeholder="Escribí tu consulta..." autocomplete="off">
            <button type="submit" class="send-btn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
        <div class="disclaimer">
            Asistente de IA basado en información oficial pública.
        </div>
    </div>
</div>

<script>
    // 🔴 LA URL DE TU SCRIPT DE GOOGLE APPS
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzuq4kfpYSCge53mdTSueMu3mp7NgwjijZneCNAonOO0rej-mc6gDn7pPVf7QbgSyWR/exec';

    const chatBody = document.getElementById('chatBody');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const suggestions = document.getElementById('suggestions');

    // Variables para guardar el archivo
    let fileBase64 = null;
    let fileName = null;
    let fileMimeType = null;

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
        msgDiv.innerText = text;
        
        chatBody.insertBefore(msgDiv, typingIndicator);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function sendQuickMessage(text) {
        userInput.value = text;
        if(suggestions) suggestions.style.display = 'none';
        handleSend(new Event('submit'));
    }

    // Función para leer el archivo cuando el usuario lo elige
    function updateFileLabel() {
        const fileInput = document.getElementById('fileInput');
        const attachLabel = document.getElementById('attachLabel');
        
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            fileName = file.name;
            fileMimeType = file.type;
            
            attachLabel.classList.add('has-file');
            userInput.placeholder = "📎 Archivo listo para enviar..."; 
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // Separamos el encabezado para quedarnos solo con el código base64
                fileBase64 = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        } else {
            resetFileInput();
        }
    }

    // Función para limpiar después de enviar
    function resetFileInput() {
        fileBase64 = null;
        fileName = null;
        fileMimeType = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('attachLabel').classList.remove('has-file');
        userInput.placeholder = "Escribí tu consulta...";
    }

    async function handleSend(e) {
        e.preventDefault();
        const text = userInput.value.trim();
        
        // No hacemos nada si no hay texto y tampoco hay archivo
        if (!text && !fileBase64) return; 

        if(suggestions) suggestions.style.display = 'none';

        // Mostramos el mensaje en el chat del usuario
        let mensajeVisual = text;
        if (fileName) mensajeVisual += (text ? "\n" : "") + "📎 [" + fileName + "]";
        appendMessage(mensajeVisual || "📎 Archivo enviado", 'user');
        
        // Preparamos el paquete de datos
        const payload = {
            pregunta: text || "Te adjunto un archivo.", 
            fileName: fileName,
            fileBase64: fileBase64,
            mimeType: fileMimeType
        };

        // Limpiamos los campos
        userInput.value = '';
        resetFileInput();

        typingIndicator.style.display = 'flex';
        chatBody.scrollTop = chatBody.scrollHeight;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            typingIndicator.style.display = 'none';

            if (data.status === 'success') {
                appendMessage(data.respuesta, 'bot');
            } else {
                appendMessage('Lo siento, ocurrió un error al procesar tu consulta.', 'bot');
            }
        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMessage('Error de conexión. Intente nuevamente más tarde.', 'bot');
        }
    }
</script>

</body>
</html>
